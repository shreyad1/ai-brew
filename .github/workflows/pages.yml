name: Publish web app

on:
  push:
    branches: [main]
  # The daily job commits with GITHUB_TOKEN, which doesn't trigger "push" workflows,
  # so also rebuild whenever the daily issue run finishes.
  workflow_run:
    workflows: ["Daily issue"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://thedailyaicup.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the issue the daily job just committed

      - uses: astral-sh/setup-uv@v6

      - name: Build the app
        run: uv sync --frozen && uv run build_site.py

      # The app lives at thedailyaicup.pages.dev (Cloudflare Pages, free plan).
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is missing, so thedailyaicup.pages.dev was not updated."
          else
            # Creating an existing project fails harmlessly, so this is safe on every run.
            npx -y wrangler@4.40.0 pages project create thedailyaicup --production-branch main || true
            npx -y wrangler@4.40.0 pages deploy site --project-name thedailyaicup --branch main
            # The old name's site forwards every path (and the #/issue/... part) to the new one.
            mkdir -p old-name && echo "/* https://thedailyaicup.pages.dev/:splat 301" > old-name/_redirects
            npx -y wrangler@4.40.0 pages deploy old-name --project-name theaibrew --branch main
          fi

      # The old GitHub Pages address now just forwards there, keeping the #/issue/... part.
      - name: Build the forwarding page
        run: |
          mkdir -p forward
          cat > forward/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>The Daily AI Cup has moved</title>
          <link rel="canonical" href="https://thedailyaicup.pages.dev/">
          <script>location.replace("https://thedailyaicup.pages.dev/" + location.hash);</script>
          <p>The Daily AI Cup has moved to <a href="https://thedailyaicup.pages.dev/">thedailyaicup.pages.dev</a>.</p>
          EOF
          mkdir -p forward/issues
          for f in site/issues/*.html; do
            d=$(basename "$f" .html)
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://thedailyaicup.pages.dev/#/issue/%s">' "$d" > "forward/issues/$d.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: forward
      - id: deployment
        uses: actions/deploy-pages@v4

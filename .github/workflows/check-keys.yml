name: Check keys

# Run by hand to confirm the secrets work, without writing or sending an issue.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Buttondown key
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Token $BUTTONDOWN_API_KEY" "https://api.buttondown.com/v1/emails?page_size=1")
          echo "Buttondown answered $code"
          [ "$code" = "200" ]
